<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUHMANN // Zettelkasten & Marginalia Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 高对比先锋报刊网格 & 瑞士档案美学 (High-Contrast Avant-Garde Editorial Grid) */
    --bg-paper: #F4F1EA;
    --bg-paper-elevated: #FAF8F5;
    --bg-paper-sunken: #EAE5DC;
    --ink-black: #121211;
    --ink-charcoal: #3D3B38;
    --ink-muted: #78746E;
    --border-heavy: #121211;
    --border-hairline: #D2CDC3;
    
    /* 信号与批注色 */
    --signal-vermilion: #D9381E; /* 朱砂信号色 */
    --signal-cobalt: #1B4965;    /* 钴蓝文献色 */
    --signal-ochre: #C87D20;     /* 赭石闪念色 */
    --highlight-amber: rgba(235, 180, 60, 0.28);
    --highlight-amber-active: rgba(217, 56, 30, 0.18);

    /* 字体系统 */
    --font-serif: 'Newsreader', 'Songti SC', 'Noto Serif SC', Georgia, serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-black);
    font-family: var(--font-sans);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    /* 细微纸张肌理噪点 */
    background-image: radial-gradient(rgba(18, 18, 17, 0.04) 1px, transparent 0);
    background-size: 24px 24px;
  }

  /* 顶部瑞士网格报头 */
  .masthead {
    height: 48px;
    border-bottom: 2px solid var(--border-heavy);
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    background-color: var(--bg-paper);
    z-index: 10;
    flex-shrink: 0;
  }

  .masthead-cell {
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-right: 1px solid var(--border-heavy);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .masthead-cell:last-child {
    border-right: none;
    justify-content: space-between;
  }

  .brand-mark {
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    background-color: var(--signal-vermilion);
    display: inline-block;
  }

  .masthead-meta {
    color: var(--ink-muted);
    display: flex;
    gap: 24px;
  }

  .masthead-meta span strong {
    color: var(--ink-black);
    font-weight: 600;
  }

  .btn-new-zettel {
    background: var(--ink-black);
    color: var(--bg-paper);
    border: none;
    padding: 5px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s ease;
  }

  .btn-new-zettel:hover {
    background: var(--signal-vermilion);
  }

  /* 主工作区三栏非对称网格 */
  .studio-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    overflow: hidden;
  }

  /* ================= 1. 左侧：卡片盒索引流 ================= */
  .pane-index {
    border-right: 1px solid var(--border-heavy);
    display: flex;
    flex-direction: column;
    background-color: var(--bg-paper);
    overflow: hidden;
  }

  .index-controls {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-hairline);
    background-color: var(--bg-paper-sunken);
  }

  .search-box {
    width: 100%;
    background: var(--bg-paper-elevated);
    border: 1px solid var(--border-heavy);
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-black);
    margin-bottom: 12px;
    outline: none;
  }

  .search-box:focus {
    border-color: var(--signal-vermilion);
    box-shadow: 2px 2px 0 var(--signal-vermilion);
  }

  .filter-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--border-heavy);
    background: var(--bg-paper);
  }

  .filter-btn {
    background: transparent;
    border: none;
    border-right: 1px solid var(--border-heavy);
    padding: 6px 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--ink-charcoal);
    transition: all 0.12s;
  }

  .filter-btn:last-child {
    border-right: none;
  }

  .filter-btn.active {
    background: var(--ink-black);
    color: var(--bg-paper);
    font-weight: 600;
  }

  .card-stream {
    flex: 1;
    overflow-y: auto;
    divide-y: 1px solid var(--border-hairline);
  }

  .zettel-card {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border-hairline);
    cursor: pointer;
    position: relative;
    transition: background-color 0.15s ease;
    background-color: var(--bg-paper);
  }

  .zettel-card:hover {
    background-color: var(--bg-paper-elevated);
  }

  .zettel-card.active {
    background-color: var(--bg-paper-elevated);
  }

  .zettel-card.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background-color: var(--signal-vermilion);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .zettel-id {
    font-weight: 600;
    color: var(--ink-black);
    background: var(--bg-paper-sunken);
    padding: 2px 6px;
    border: 1px solid var(--border-hairline);
  }

  .zettel-type-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border: 1px solid currentColor;
  }

  .type-permanent { color: var(--signal-vermilion); }
  .type-literature { color: var(--signal-cobalt); }
  .type-fleeting { color: var(--signal-ochre); }

  .card-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 8px;
    color: var(--ink-black);
  }

  .card-excerpt {
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
  }

  /* ================= 2. 中部：主阅读与旁注工作台 ================= */
  .pane-reader {
    overflow-y: auto;
    background-color: var(--bg-paper-elevated);
    position: relative;
    scroll-behavior: smooth;
  }

  /* 内部非对称双栏：正文区 + 旁注栏 (Marginalia) */
  .editorial-sheet {
    max-width: 1040px;
    margin: 0 auto;
    padding: 48px 40px 120px 56px;
    display: grid;
    grid-template-columns: minmax(460px, 600px) 280px;
    gap: 48px;
    position: relative;
  }

  /* 档案头部元数据 */
  .folio-header {
    grid-column: 1 / -1;
    border-bottom: 2px solid var(--border-heavy);
    padding-bottom: 24px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 24px;
  }

  .folio-classification {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--signal-vermilion);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .folio-title {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: -0.015em;
    color: var(--ink-black);
  }

  .folio-stamp {
    border: 1px solid var(--border-heavy);
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.6;
    background: var(--bg-paper);
    min-width: 190px;
  }

  .folio-stamp div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .folio-stamp span:first-child {
    color: var(--ink-muted);
  }

  /* 主文本排版区 */
  .manuscript-body {
    font-family: var(--font-serif);
    font-size: 18.5px;
    line-height: 1.82;
    color: var(--ink-black);
  }

  .manuscript-body p {
    margin-bottom: 1.5em;
    position: relative;
    text-align: justify;
  }

  /* 章节小标题 */
  .manuscript-body h3 {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 2.4em 0 1em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-hairline);
    color: var(--ink-charcoal);
  }

  .manuscript-body blockquote {
    margin: 1.8em 0;
    padding: 4px 0 4px 24px;
    border-left: 3px solid var(--ink-black);
    font-style: italic;
    color: var(--ink-charcoal);
    background: linear-gradient(90deg, var(--bg-paper) 0%, transparent 100%);
  }

  /* 行间批注高亮 (Marginalia Highlight) */
  .annotated-passage {
    background-color: var(--highlight-amber);
    border-bottom: 1.5px solid var(--signal-ochre);
    padding: 1px 3px;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
  }

  .annotated-passage:hover,
  .annotated-passage.active {
    background-color: var(--highlight-amber-active);
    border-bottom-color: var(--signal-vermilion);
  }

  .marginalia-sup {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--signal-vermilion);
    vertical-align: super;
    margin-left: 2px;
    user-select: none;
  }

  /* 双向链接内联标记 [[Wiki-Link]] */
  .wikilink {
    font-family: var(--font-mono);
    font-size: 0.82em;
    color: var(--signal-cobalt);
    background-color: rgba(27, 73, 101, 0.07);
    border: 1px solid rgba(27, 73, 101, 0.28);
    padding: 1px 6px;
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .wikilink:hover {
    background-color: var(--signal-cobalt);
    color: var(--bg-paper-elevated);
    border-color: var(--signal-cobalt);
  }

  .wikilink::before {
    content: '↗ ';
    font-size: 0.9em;
  }

  /* 侧边批注栏 (Marginalia Column) */
  .marginalia-rail {
    border-left: 1px solid var(--border-hairline);
    padding-left: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-self: start;
  }

  .marginalia-rail-header {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-heavy);
    display: flex;
    justify-content: space-between;
  }

  .margin-note-card {
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.55;
    position: relative;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .margin-note-card::before {
    content: '';
    position: absolute;
    left: -25px;
    top: 18px;
    width: 24px;
    height: 1px;
    background-color: var(--border-hairline);
    transition: all 0.2s ease;
  }

  .margin-note-card:hover,
  .margin-note-card.active {
    border-color: var(--ink-black);
    transform: translateX(-4px);
    box-shadow: 4px 4px 0 var(--ink-black);
    background: var(--bg-paper-elevated);
  }

  .margin-note-card.active::before {
    background-color: var(--signal-vermilion);
    height: 2px;
  }

  .margin-note-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--signal-vermilion);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    font-weight: 600;
  }

  .margin-note-text {
    color: var(--ink-charcoal);
    font-family: var(--font-sans);
  }

  .margin-add-box {
    margin-top: 8px;
    border: 1px dashed var(--border-heavy);
    padding: 12px;
    background: rgba(244, 241, 234, 0.5);
  }

  .margin-add-box textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 12px;
    resize: none;
    outline: none;
    color: var(--ink-black);
    margin-bottom: 8px;
  }

  .btn-commit-note {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    padding: 4px 10px;
    background: var(--ink-black);
    color: var(--bg-paper);
    border: none;
    cursor: pointer;
  }

  .btn-commit-note:hover {
    background: var(--signal-vermilion);
  }

  /* 文献出处底栏 */
  .folio-bibliography {
    grid-column: 1 / 2;
    margin-top: 36px;
    padding: 18px 20px;
    background: var(--bg-paper);
    border: 1px solid var(--border-heavy);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
  }

  .folio-bibliography-label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 4px;
    letter-spacing: 0.08em;
  }

  /* ================= 3. 右侧：双向链接图谱与反向引用 ================= */
  .pane-network {
    border-left: 1px solid var(--border-heavy);
    background-color: var(--bg-paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section-title {
    padding: 12px 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border-heavy);
    background-color: var(--bg-paper-sunken);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 局部知识图谱 SVG 容器 */
  .graph-viewport {
    height: 290px;
    border-bottom: 1px solid var(--border-heavy);
    position: relative;
    background-color: var(--bg-paper-elevated);
    background-image: 
      linear-gradient(to right, rgba(18,18,17,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(18,18,17,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow: hidden;
  }

  #network-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .graph-legend {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-muted);
    display: flex;
    gap: 10px;
    background: rgba(244, 241, 234, 0.88);
    padding: 3px 8px;
    border: 1px solid var(--border-hairline);
  }

  /* 反向链接与出链容器 */
  .backlinks-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .backlink-group-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border-hairline);
    padding-bottom: 6px;
  }

  .backlink-item {
    background: var(--bg-paper-elevated);
    border: 1px solid var(--border-hairline);
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .backlink-item:hover {
    border-color: var(--ink-black);
    box-shadow: 3px 3px 0 var(--ink-black);
  }

  .backlink-item-head {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    margin-bottom: 6px;
  }

  .backlink-id {
    color: var(--signal-vermilion);
    font-weight: 600;
  }

  .backlink-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--ink-black);
  }

  .backlink-snippet {
    font-size: 12px;
    color: var(--ink-charcoal);
    line-height: 1.45;
    background: var(--bg-paper);
    padding: 6px 8px;
    border-left: 2px solid var(--signal-cobalt);
    font-family: var(--font-serif);
  }

  /* 自定义滚动条 */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-paper);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border-hairline);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--ink-muted);
  }

  /* 文本选中高亮提示浮层 */
  .selection-tooltip {
    position: fixed;
    display: none;
    background: var(--ink-black);
    color: var(--bg-paper);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 4px 4px 0 var(--signal-vermilion);
    border: 1px solid var(--bg-paper);
  }
</style>
</head>
<body>

  <!-- 顶部瑞士档案报头 -->
  <header class="masthead">
    <div class="masthead-cell">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span>ZETTELKASTEN // ARCHIVE II</span>
      </div>
    </div>
    <div class="masthead-cell">
      <div class="masthead-meta">
        <span>BOX: <strong>SOZIOLOGIE & KYBERNETIK</strong></span>
        <span>CARDS: <strong id="stat-total-cards">7</strong></span>
        <span>SYNAPSES: <strong id="stat-total-links">16</strong></span>
        <span>MARGINALIA: <strong id="stat-total-notes">14</strong></span>
      </div>
    </div>
    <div class="masthead-cell">
      <span>INDEX: FOLIO-1981-B</span>
      <button class="btn-new-zettel" id="btn-random-jump" title="随机漫游卡片盒">↻ SERENDIPITY</button>
    </div>
  </header>

  <!-- 三栏主体工作室 -->
  <main class="studio-grid">
    
    <!-- 1. 左侧：卡片索引流 -->
    <aside class="pane-index">
      <div class="index-controls">
        <input type="text" id="search-input" class="search-box" placeholder="检索编号、标题或概念词...">
        <div class="filter-tabs" id="filter-tabs">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="permanent">永久</button>
          <button class="filter-btn" data-filter="literature">文献</button>
          <button class="filter-btn" data-filter="fleeting">闪念</button>
        </div>
      </div>
      <div class="card-stream" id="card-stream">
        <!-- 动态渲染卡片列表 -->
      </div>
    </aside>

    <!-- 2. 中部：主阅读与排版批注区 -->
    <section class="pane-reader" id="pane-reader">
      <article class="editorial-sheet" id="editorial-sheet">
        <!-- 动态渲染主文稿与侧边批注 -->
      </article>
    </section>

    <!-- 3. 右侧：双向链接小图谱与反向引用 -->
    <aside class="pane-network">
      <div class="panel-section-title">
        <span>TOPOLOGY // 局部双链拓扑</span>
        <span id="graph-center-id">21/3a1</span>
      </div>
      <div class="graph-viewport">
        <svg id="network-svg" viewBox="0 0 340 290"></svg>
        <div class="graph-legend">
          <span>● 当前节点</span>
          <span>○ 关联卡片</span>
          <span>― 双向引用</span>
        </div>
      </div>

      <div class="panel-section-title">
        <span>BACKLINKS & CITATIONS // 引用上下文</span>
        <span id="backlink-count">0</span>
      </div>
      <div class="backlinks-container" id="backlinks-container">
        <!-- 动态渲染反向链接与出链 -->
      </div>
    </aside>

  filterTabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderCardStream();
  });

  // 随机漫游按钮 (Serendipity)
  document.getElementById("btn-random-jump").addEventListener("click", () => {
    const others = ZETTEL_DATA.filter(c => c.id !== currentCardId);
    const randomCard = others[Math.floor(Math.random() * others.length)];
    selectCard(randomCard.id);
  });

  // 监听正文区划词以支持动态添加行间批注
  document.addEventListener("mouseup", handleTextSelection);
}

/**
 * 更新顶部统计栏
 */
function updateGlobalStats() {
  document.getElementById("stat-total-cards").textContent = ZETTEL_DATA.length;
  const totalLinks = ZETTEL_DATA.reduce((acc, c) => acc + c.linksTo.length, 0);
  const totalNotes = ZETTEL_DATA.reduce((acc, c) => acc + c.marginalia.length, 0);
  document.getElementById("stat-total-links").textContent = totalLinks;
  document.getElementById("stat-total-notes").textContent = totalNotes;
}

/**
 * 渲染左侧卡片索引流
 */
function renderCardStream() {
  const filtered = ZETTEL_DATA.filter(card => {
    const matchType = currentFilter === "all" || card.type === currentFilter;
    const matchQuery = !searchQuery || 
      card.id.toLowerCase().includes(searchQuery) ||
      card.title.toLowerCase().includes(searchQuery) ||
      card.excerpt.toLowerCase().includes(searchQuery) ||
      card.tags.some(t => t.toLowerCase().includes(searchQuery));
    return matchType && matchQuery;
  });

  if (filtered.length === 0) {
    cardStreamEl.innerHTML = `
      <div style="padding: 32px 20px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); text-align: center;">
        [ NO MATCHING ZETTEL IN ARCHIVE ]
      </div>
    `;
    return;
  }

  cardStreamEl.innerHTML = filtered.map(card => {
    const isActive = card.id === currentCardId ? "active" : "";
    const backlinksCount = getBacklinksFor(card.id).length;
    return `
      <div class="zettel-card ${isActive}" data-id="${card.id}">
        <div class="card-header">
          <span class="zettel-id">№ ${card.id}</span>
          <span class="zettel-type-badge type-${card.type}">${card.typeLabel}</span>
        </div>
        <h4 class="card-title">${card.title}</h4>
        <p class="card-excerpt">${card.excerpt}</p>
        <div class="card-footer">
          <span>${card.tags.slice(0, 2).join(" ")}</span>
          <span>⇄ ${card.linksTo.length + backlinksCount} · ✎ ${card.marginalia.length}</span>
        </div>
      </div>
    `;
  }).join("");

  // 绑定点击事件
  cardStreamEl.querySelectorAll(".zettel-card").forEach(el => {
    el.addEventListener("click", () => {
      selectCard(el.dataset.id);
    });
  });
}

/**
 * 切换当前激活的卡片，同步更新三栏
 */
function selectCard(cardId) {
  const card = ZETTEL_DATA.find(c => c.id === cardId);
  if (!card) return;
  currentCardId = cardId;
  activeMarginaliaId = null;

  // 更新左侧高亮态
  document.querySelectorAll(".zettel-card").forEach(el => {
    el.classList.toggle("active", el.dataset.id === cardId);
  });

  // 渲染中部阅读与批注工作台
  renderReaderFolio(card);

  // 渲染右侧双链关系图谱与反向链接列表
  renderNetworkGraph(card);
  renderBacklinksList(card);

  // 滚动阅读器回顶部
  document.getElementById("pane-reader").scrollTop = 0;
}

/**
 * 渲染中部主阅读区与侧边批注栏 (Marginalia)
 */
function renderReaderFolio(card) {
  const backlinks = getBacklinksFor(card.id);

  editorialSheetEl.innerHTML = `
    <header class="folio-header">
      <div>
        <div class="folio-classification">
          <span>ZETTEL-ID // ${card.id}</span>
          <span>·</span>
          <span>${card.typeLabel} (${card.type.toUpperCase()})</span>
        </div>
        <h1 class="folio-title">${card.title}</h1>
      </div>
      <div class="folio-stamp">
        <div><span>DATE:</span><strong>${card.date}</strong></div>
        <div><span>OUT-LINKS:</span><strong>${card.linksTo.length} CARDS</strong></div>
        <div><span>BACKLINKS:</span><strong>${backlinks.length} CARDS</strong></div>
        <div><span>TAGS:</span><strong>${card.tags.join(" ")}</strong></div>
      </div>
    </header>

    <div class="manuscript-body" id="manuscript-body">
      ${card.body}
      <div class="folio-bibliography">
        <div class="folio-bibliography-label">BIBLIOGRAPHIC PROVENANCE // 文献与档案溯源</div>
        <div>${card.source}</div>
      </div>
    </div>

    <aside class="marginalia-rail">
      <div class="marginalia-rail-header">
        <span>MARGINALIA // 页边批注</span>
        <span>[${card.marginalia.length}]</span>
      </div>
      <div id="marginalia-list" style="display:flex; flex-direction:column; gap:14px;">
        ${card.marginalia.map((m, idx) => `
          <div class="margin-note-card" data-note-id="${m.id}">
            <div class="margin-note-meta">
              <span>[m${idx + 1}] ${m.refLabel}</span>
              <span>@${m.author}</span>
            </div>
            <div class="margin-note-text">${m.text}</div>
          </div>
        `).join("")}
      </div>

      <div class="margin-add-box">
        <textarea id="new-margin-input" rows="2" placeholder="撰写新的页边批注（或直接选中左侧正文段落高亮批注）..."></textarea>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-family:var(--font-mono); font-size:9px; color:var(--ink-muted);">FOLIO: ${card.id}</span>
          <button class="btn-commit-note" id="btn-add-margin">+ 批注归档</button>
        </div>
      </div>
    </aside>
  `;

  // 绑定正文中双链 [[WikiLink]] 点击跳转
  editorialSheetEl.querySelectorAll(".wikilink").forEach(link => {
    link.addEventListener("click", (e) => {
      e.stopPropagation();
      const targetId = link.dataset.target;
      selectCard(targetId);
    });
  });

  // 绑定行间高亮与侧边批注的双向联动
  const passages = editorialSheetEl.querySelectorAll(".annotated-passage");
  const noteCards = editorialSheetEl.querySelectorAll(".margin-note-card");

  passages.forEach(p => {
    p.addEventListener("click", () => {
      const noteId = p.dataset.noteId;
      highlightMarginaliaPair(noteId);
    });
    p.addEventListener("mouseenter", () => {
      highlightMarginaliaPair(p.dataset.noteId, true);
    });
    p.addEventListener("mouseleave", () => {
      if (!activeMarginaliaId) clearMarginaliaHighlight();
    });
  });

  noteCards.forEach(nc => {
    nc.addEventListener("click", () => {
      const noteId = nc.dataset.noteId;
      activeMarginaliaId = (activeMarginaliaId === noteId) ? null : noteId;
      highlightMarginaliaPair(noteId);
    });
  });

  // 绑定新增页边批注
  document.getElementById("btn-add-margin").addEventListener("click", () => {
    const input = document.getElementById("new-margin-input");
    const val = input.value.trim();
    if (!val) return;
    const newId = "m_custom_" + Date.now();
    card.marginalia.push({
      id: newId,
      refLabel: "手稿附记",
      author: "STUDIO",
      text: val
    });
    updateGlobalStats();
    renderReaderFolio(card);
    renderCardStream();
  });
}

/**
 * 联动高亮正文行间批注与右侧边栏批注卡片
 */
function highlightMarginaliaPair(noteId, isHover = false) {
  const passages = editorialSheetEl.querySelectorAll(".annotated-passage");
  const noteCards = editorialSheetEl.querySelectorAll(".margin-note-card");

  passages.forEach(p => {
    p.classList.toggle("active", p.dataset.noteId === noteId);
  });
  noteCards.forEach(nc => {
    const match = nc.dataset.noteId === noteId;
    nc.classList.toggle("active", match);
    if (match && !isHover) {
      nc.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });
}

function clearMarginaliaHighlight() {
  editorialSheetEl.querySelectorAll(".annotated-passage, .margin-note-card").forEach(el => {
    el.classList.remove("active");
  });
}

/**
 * 计算指向某张卡片的所有反向链接 (Backlinks)
 */
function getBacklinksFor(targetId) {
  return ZETTEL_DATA.filter(c => c.id !== targetId && c.linksTo.includes(targetId));
}

/**
 * 渲染右侧反向引用与出链上下文列表
 */
function renderBacklinksList(card) {
  const backlinks = getBacklinksFor(card.id);
  const outlinks = card.linksTo
    .map(id => ZETTEL_DATA.find(c => c.id === id))
    .filter(Boolean);

  document.getElementById("backlink-count").textContent = `${backlinks.length} IN / ${outlinks.length} OUT`;

  let html = `<div class="backlink-group-label">← INCOMING BACKLINKS // 反向引用 (${backlinks.length})</div>`;

  if (backlinks.length === 0) {
    html += `<div style="font-size:12px; color:var(--ink-muted); font-family:var(--font-mono); padding:4px 0;">暂无其他卡片指向此节点</div>`;
  } else {
    html += backlinks.map(b => `
      <div class="backlink-item" data-id="${b.id}">
        <div class="backlink-item-head">
          <span class="backlink-id">← № ${b.id}</span>
          <span>${b.typeLabel}</span>
        </div>
        <div class="backlink-title">${b.title}</div>
        <div class="backlink-snippet">“${b.excerpt}”</div>
      </div>
    `).join("");
  }

  html += `<div class="backlink-group-label" style="margin-top:8px;">→ OUTGOING CITATIONS // 主动引证 (${outlinks.length})</div>`;

  html += outlinks.map(o => `
    <div class="backlink-item" data-id="${o.id}">
      <div class="backlink-item-head">
        <span class="backlink-id" style="color:var(--signal-cobalt);">→ № ${o.id}</span>
        <span>${o.typeLabel}</span>
      </div>
      <div class="backlink-title">${o.title}</div>
    </div>
  `).join("");

  backlinksContainerEl.innerHTML = html;

  backlinksContainerEl.querySelectorAll(".backlink-item").forEach(item => {
    item.addEventListener("click", () => {
      selectCard(item.dataset.id);
    });
  });
}

/**
 * 渲染右侧 SVG 双向链接关系小图谱 (瑞士工程制图风格)
 */
function renderNetworkGraph(centerCard) {
  document.getElementById("graph-center-id").textContent = `CENTER: ${centerCard.id}`;
  const width = 340;
  const height = 290;
  const cx = width / 2;
  const cy = height / 2;

  // 收集一度直接关联节点与二度节点
  const backlinkCards = getBacklinksFor(centerCard.id);
  const outlinkCards = centerCard.linksTo.map(id => ZETTEL_DATA.find(c => c.id === id)).filter(Boolean);

  const neighborMap = new Map();
  backlinkCards.forEach(c => neighborMap.set(c.id, { card: c, relation: "in" }));
  outlinkCards.forEach(c => {
    if (neighborMap.has(c.id)) {
      neighborMap.set(c.id, { card: c, relation: "mutual" });
    } else {
      neighborMap.set(c.id, { card: c, relation: "out" });
    }
  });

  const neighbors = Array.from(neighborMap.values());
  const otherCards = ZETTEL_DATA.filter(c => c.id !== centerCard.id && !neighborMap.has(c.id));

  // 计算节点坐标
  const nodePositions = new Map();
  nodePositions.set(centerCard.id, { x: cx, y: cy, card: centerCard, isCenter: true });

  const radius1 = 88;
  neighbors.forEach((n, idx) => {
    const angle = (idx / neighbors.length) * Math.PI * 2 - Math.PI / 2;
    nodePositions.set(n.card.id, {
      x: cx + Math.cos(angle) * radius1,
      y: cy + Math.sin(angle) * radius1,
      card: n.card,
      relation: n.relation,
      isNeighbor: true
    });
  });

  // 外围二级节点分布在四角边缘
  const radius2 = 126;
  otherCards.forEach((c, idx) => {
    const angle = (idx / Math.max(1, otherCards.length)) * Math.PI * 2 + 0.4;
    nodePositions.set(c.id, {
      x: cx + Math.cos(angle) * radius2,
      y: cy + Math.sin(angle) * radius2,
      card: c,
      isOuter: true
    });
  });

  // 生成连线 SVG
  let edgesSvg = "";
  ZETTEL_DATA.forEach(source => {
    const p1 = nodePositions.get(source.id);
    if (!p1) return;
    source.linksTo.forEach(targetId => {
      const p2 = nodePositions.get(targetId);
      if (!p2) return;
      const isDirect = source.id === centerCard.id || targetId === centerCard.id;
      const strokeColor = isDirect ? "#121211" : "#C5BFB3";
      const strokeWidth = isDirect ? "1.5" : "0.8";
      const dash = isDirect ? "none" : "3,3";
      edgesSvg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${strokeColor}" stroke-width
