<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVUM // Luhmann Zettelkasten & Marginalia Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 典藏羊皮纸与学术活字色调体系 (Archival Parchment & Scholarly Press) */
    --bg-canvas: #F3EFE6;
    --bg-sheet: #FAF7F0;
    --bg-panel: #EBE5D8;
    --bg-active: #E2DAC9;
    
    --ink-primary: #1C1A17;
    --ink-secondary: #544E46;
    --ink-muted: #8C8478;
    --ink-faint: #C4BCAE;
    
    --rule-hairline: #D6CEBF;
    --rule-heavy: #2A2622;
    
    /* 矿物印泥点缀色 */
    --accent-vermilion: #B83A24; /* 朱砂：核心锚点与永久卡 */
    --accent-vermilion-soft: rgba(184, 58, 36, 0.12);
    --accent-ochre: #C88A2B;     /* 赭石：文献批注与高亮 */
    --accent-ochre-soft: rgba(200, 138, 43, 0.16);
    --accent-ochre-active: rgba(200, 138, 43, 0.32);
    --accent-slate: #2D5266;     /* 黛蓝：双向链接与闪念卡 */
    --accent-slate-soft: rgba(45, 82, 102, 0.12);
    --accent-sage: #49664E;      /* 苍绿：文献卡 */

    --font-serif: 'Newsreader', 'Noto Serif SC', Georgia, serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    /* 微妙的纸张噪点纹理 */
    background-image: radial-gradient(rgba(28, 26, 23, 0.035) 1px, transparent 0);
    background-size: 24px 24px;
  }

  /* 顶部档案架检索栏 */
  .top-colophon {
    height: 44px;
    border-bottom: 2px solid var(--rule-heavy);
    background-color: var(--bg-canvas);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    z-index: 10;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    color: var(--ink-primary);
  }

  .brand-stamp {
    background: var(--ink-primary);
    color: var(--bg-sheet);
    padding: 2px 7px;
    font-size: 10px;
    letter-spacing: 0.1em;
  }

  .breadcrumb-trail {
    color: var(--ink-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .breadcrumb-trail span.active-fol {
    color: var(--accent-vermilion);
    font-weight: 500;
  }

  .archive-stats {
    display: flex;
    gap: 16px;
    color: var(--ink-muted);
  }

  /* 主三栏非对称网格 */
  .studio-workspace {
    display: grid;
    grid-template-columns: 310px 1fr 340px;
    flex: 1;
    height: calc(100vh - 44px);
    overflow: hidden;
  }

  /* ==================== 左侧：卢曼卡片盒索引栏 ==================== */
  .slipbox-drawer {
    border-right: 1px solid var(--rule-hairline);
    background-color: var(--bg-canvas);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .drawer-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--rule-hairline);
  }

  .drawer-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .drawer-title {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-secondary);
    font-weight: 600;
  }

  .search-box {
    width: 100%;
    background: var(--bg-sheet);
    border: 1px solid var(--rule-hairline);
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-primary);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .search-box:focus {
    border-color: var(--ink-primary);
  }

  /* 卡片类型筛选器 */
  .filter-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--ink-primary);
    background: var(--bg-sheet);
  }

  .filter-btn {
    background: transparent;
    border: none;
    border-right: 1px solid var(--ink-primary);
    padding: 6px 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }
  .filter-btn:last-child {
    border-right: none;
  }
  .filter-btn:hover {
    background: var(--bg-panel);
  }
  .filter-btn.active {
    background: var(--ink-primary);
    color: var(--bg-sheet);
    font-weight: 500;
  }

  /* 索引卡片流 */
  .zettel-stream {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .zettel-card {
    background: var(--bg-sheet);
    border: 1px solid var(--rule-hairline);
    padding: 12px 14px;
    cursor: pointer;
    position: relative;
    transition: all 0.18s ease;
    border-left: 3px solid transparent;
  }

  /* 拟真打孔卡片细节 */
  .zettel-card::after {
    content: '';
    position: absolute;
    top: 12px;
    right: 12px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    border: 1px solid var(--ink-faint);
    background: var(--bg-canvas);
  }

  .zettel-card:hover {
    border-color: var(--ink-secondary);
    transform: translateX(2px);
  }

  .zettel-card.active {
    background: #FFFDF9;
    border-color: var(--ink-primary);
    border-left: 4px solid var(--accent-vermilion);
    box-shadow: 3px 3px 0px rgba(28, 26, 23, 0.08);
  }

  .card-meta-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .folgezettel-id {
    font-weight: 600;
    color: var(--ink-primary);
    background: var(--bg-panel);
    padding: 1px 5px;
    border: 1px solid var(--rule-hairline);
  }

  .zettel-card.active .folgezettel-id {
    background: var(--accent-vermilion);
    color: #fff;
    border-color: var(--accent-vermilion);
  }

  .type-badge {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 5px;
    border: 1px solid currentColor;
  }
  .type-permanent { color: var(--accent-vermilion); }
  .type-literature { color: var(--accent-sage); }
  .type-fleeting { color: var(--accent-slate); }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--ink-primary);
    margin-bottom: 6px;
  }

  .card-excerpt {
    font-size: 12px;
    color: var(--ink-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
    border-top: 1px dashed var(--rule-hairline);
    padding-top: 6px;
  }

  /* ==================== 中部：手稿精读与侧边批注台 ==================== */
  .manuscript-desk {
    background-color: var(--bg-sheet);
    overflow-y: auto;
    position: relative;
    scroll-behavior: smooth;
    /* 经典古籍竖向分界线 */
    background-image: linear-gradient(to right, transparent 65.5%, var(--rule-hairline) 65.5%, var(--rule-hairline) calc(65.5% + 1px), transparent calc(65.5% + 1px));
  }

  .manuscript-sheet {
    max-width: 980px;
    margin: 0 auto;
    padding: 44px 36px 96px 48px;
  }

  /* 档案头部元数据表 */
  .sheet-header {
    display: grid;
    grid-template-columns: 62% 4% 34%;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--ink-primary);
  }

  .header-main {
    grid-column: 1 / 2;
  }

  .header-fol-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-family: var(--font-mono);
  }

  .sheet-fol-id {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-vermilion);
    letter-spacing: 0.04em;
  }

  .sheet-date {
    font-size: 12px;
    color: var(--ink-muted);
  }

  .sheet-title {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.28;
    color: var(--ink-primary);
    letter-spacing: -0.01em;
    margin-bottom: 14px;
  }

  .sheet-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-secondary);
    background: var(--bg-canvas);
    border: 1px solid var(--rule-hairline);
    padding: 2px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tag-pill:hover {
    border-color: var(--ink-primary);
    color: var(--ink-primary);
  }

  .header-biblio {
    grid-column: 3 / 4;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-secondary);
    border-left: 2px solid var(--accent-ochre);
    padding-left: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .biblio-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }

  .biblio-cite {
    line-height: 1.45;
    color: var(--ink-primary);
    margin-bottom: 10px;
  }

  .add-gloss-btn {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--ink-primary);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 8px;
    cursor: pointer;
    color: var(--ink-primary);
    transition: all 0.15s;
  }
  .add-gloss-btn:hover {
    background: var(--ink-primary);
    color: var(--bg-sheet);
  }

  /* 段落与批注同行对齐网格 (核心排版机制) */
  .stanza-row {
    display: grid;
    grid-template-columns: 62% 4% 34%;
    margin-bottom: 26px;
    align-items: start;
    position: relative;
  }

  .prose-block {
    grid-column: 1 / 2;
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--ink-primary);
    text-align: justify;
  }

  .prose-block p {
    margin-bottom: 14px;
  }
  .prose-block p:last-child {
    margin-bottom: 0;
  }

  .prose-block blockquote {
    margin: 16px 0;
    padding: 10px 18px;
    border-left: 2px solid var(--ink-primary);
    background: var(--bg-canvas);
    font-style: italic;
    font-size: 15.5px;
    color: var(--ink-secondary);
  }

  /* 文内高亮锚点 (Loci) */
  .locus-highlight {
    background-color: var(--accent-ochre-soft);
    border-bottom: 1.5px solid var(--accent-ochre);
    padding: 1px 2px;
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s;
    position: relative;
  }

  .locus-highlight sup {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--accent-vermilion);
    margin-left: 2px;
    user-select: none;
  }

  .locus-highlight:hover,
  .locus-highlight.active {
    background-color: var(--accent-ochre-active);
    border-bottom-color: var(--accent-vermilion);
  }

  /* 文内双向链接 (WikiLink) */
  .wiki-link {
    font-family: var(--font-mono);
    font-size: 0.86em;
    color: var(--accent-slate);
    background: var(--accent-slate-soft);
    padding: 1px 6px;
    border-radius: 2px;
    text-decoration: none;
    cursor: pointer;
    border-bottom: 1px dashed var(--accent-slate);
    transition: all 0.15s;
    white-space: nowrap;
  }

  .wiki-link::before {
    content: '↗ ';
    font-size: 0.85em;
  }

  .wiki-link:hover {
    background: var(--accent-slate);
    color: #fff;
  }

  /* 侧边批注栏 (Marginalia Gloss Column) */
  .marginalia-slot {
    grid-column: 3 / 4;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-left: 14px;
  }

  .gloss-note {
    background: var(--bg-canvas);
    border: 1px solid var(--rule-hairline);
    border-left: 2.5px solid var(--ink-muted);
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  /* 批注与正文之间的视觉引线 */
  .gloss-note::before {
    content: '';
    position: absolute;
    left: -26px;
    top: 14px;
    width: 24px;
    height: 1px;
    border-top: 1px dashed var(--ink-faint);
    transition: all 0.2s;
  }

  .gloss-note:hover,
  .gloss-note.active {
    background: #FFFDF9;
    border-color: var(--ink-primary);
    border-left-color: var(--accent-vermilion);
    color: var(--ink-primary);
    transform: translateX(-3px);
    box-shadow: 2px 2px 0 rgba(28, 26, 23, 0.06);
  }

  .gloss-note:hover::before,
  .gloss-note.active::before {
    border-top: 1px solid var(--accent-vermilion);
    width: 28px;
    left: -28px;
  }

  .gloss-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    margin-bottom: 5px;
    color: var(--ink-muted);
  }

  .gloss-marker {
    color: var(--accent-vermilion);
    font-weight: 600;
  }

  .gloss-type {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 9px;
    padding: 0 4px;
    border: 1px solid var(--rule-hairline);
  }

  .gloss-body {
    font-family: var(--font-serif);
    font-style: italic;
  }

  /* 手稿底部：卢曼分支序列导航 (Folgezettel Sequence) */
  .folgezettel-footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--ink-primary);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    font-family: var(--font-mono);
  }

  .seq-nav-box {
    border: 1px solid var(--rule-hairline);
    background: var(--bg-canvas);
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .seq-nav-box:hover {
    border-color: var(--ink-primary);
    background: var(--bg-panel);
  }
  .seq-label {
    font-size: 10px;
    color: var(--ink-muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .seq-target {
    font-size: 12px;
    color: var(--ink-primary);
    font-weight: 500;
  }

  /* ==================== 右侧：双链关系小图谱与反向引用栏 ==================== */
  .nexus-inspector {
    border-left: 1px solid var(--rule-hairline);
    background-color: var(--bg-canvas);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .inspector-section-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--rule-hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-secondary);
    font-weight: 600;
    background: var(--bg-panel);
  }

  /* 双向链接拓扑小图谱 */
  .graph-stage {
    height: 270px;
    background: var(--bg-sheet);
    border-bottom: 1px solid var(--rule-hairline);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* 图谱坐标网格背景 */
  .graph-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(214, 206, 191, 0.4) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(214, 206, 191, 0.4) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  #nexus-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .graph-legend {
    position: absolute;
    bottom: 8px;
    left: 10px;
    display: flex;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--ink-secondary);
    background: rgba(250, 247, 240, 0.9);
    padding: 3px 8px;
    border: 1px solid var(--rule-hairline);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  /* 反向链接与出链上下文列表 */
  .backlinks-container {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .link-group-title {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule-hairline);
    padding-bottom: 4px;
  }

  .backlink-item {
    background: var(--bg-sheet);
    border: 1px solid var(--rule-hairline);
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .backlink-item:hover {
    border-color: var(--ink-primary);
    background: #FFFDF9;
    transform: translateX(-2px);
  }

  .backlink-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .backlink-id {
    color: var(--accent-slate);
    font-weight: 600;
  }

  .backlink-title {
    font-family: var(--font-serif);
    font-weight: 600;
    color: var(--ink-primary);
    font-size: 13px;
  }

  .backlink-snippet {
    font-size: 12px;
    color: var(--ink-secondary);
    line-height: 1.5;
    background: var(--bg-canvas);
    padding: 6px 8px;
    border-left: 2px solid var(--accent-slate);
    font-family: var(--font-serif);
  }

  .backlink-snippet mark {
    background: var(--accent-ochre-soft);
    color: var(--ink-primary);
    padding: 0 2px;
    font-weight: 500;
  }

  /* 模态框：新增行间批注 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 23, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open {
    display: flex;
  }
  .modal-dialog {
    background: var(--bg-sheet);
    border: 2px solid var(--ink-primary);
    width: 440px;
    padding: 20px 24px;
    box-shadow: 8px 8px 0 rgba(28, 26, 23, 0.2);
  }
  .modal-title {
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-hairline);
  }
  .form-field {
    margin-bottom: 14px;
  }
  .form-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }
  .form-field select,
  .form-field textarea {
    width: 100%;
    background: var(--bg-canvas);
    border: 1px solid var(--ink-secondary);
    padding: 8px;
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-primary);
    outline: none;
  }
  .modal-actions {
    display: flex;

// 全局状态管理
let state = {

  filterType: "all",
  searchQuery: "",
  activeGlossId: null

// 工具函数：解析正文中的 [[ID|显示名]] 双链语法
function parseWikiLinks(htmlString) {
  return htmlString.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, targetId, label) => {
    const targetCard = ZETTEL_ARCHIVE.find(c => c.id === targetId);
    const displayLabel = label || (targetCard ? targetCard.title : targetId);
    return `<a class="wiki-link" data-target="${targetId}" title="跳转至卡片 [${targetId}]">${targetId} · ${displayLabel}</a>`;
  });
}

// 工具函数：提取某张卡片内部发出的所有出链 ID
function getOutgoingLinks(card) {
  const outIds = new Set();
  const regex = /\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g;
  card.stanzas.forEach(stanza => {
    let m;
    while ((m = regex.exec(stanza.prose)) !== null) {
      if (m[1] !== card.id) outIds.add(m[1]);
    }
  });
  return Array.from(outIds);
}

// 工具函数：计算指向目标卡片的所有反向引用（含上下文摘要）
function getBacklinks(targetId) {
  const backlinks = [];
  const regex = new RegExp(`\\[\\[${targetId}(?:\\|([^\\]]+))?\\]\\]`, 'g');
  
  ZETTEL_ARCHIVE.forEach(card => {
    if (card.id === targetId) return;
    card.stanzas.forEach((stanza, idx) => {
      if (stanza.prose.includes(`[[${targetId}`)) {
        // 清理 HTML 标签生成干净的语境摘录，但高亮引用点
        let cleanSnippet = stanza.prose
          .replace(/<span class="locus-highlight"[^>]*>(.*?)<sup>.*?<\/sup><\/span>/g, '$1')
          .replace(/<\/?blockquote>/g, '')
          .replace(regex, (m, label) => `<mark>[[${targetId}${label ? ' | ' + label : ''}]]</mark>`)
          .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, '[$1]');
        
        backlinks.push({
          sourceId: card.id,
          sourceTitle: card.title,
          sourceType: card.type,
          stanzaIndex: idx + 1,
          snippet: cleanSnippet
        });
      }
    });
  });
  return backlinks;
}

// 统计全局档案库数据
function updateArchiveStats() {
  let totalLinks = 0;
  let totalGlosses = 0;
  ZETTEL_ARCHIVE.forEach(card => {
    totalLinks += getOutgoingLinks(card).length;
    card.stanzas.forEach(s => totalGlosses += s.marginalia.length);
  });
  document.getElementById('stat-cards').textContent = `CARDS: ${ZETTEL_ARCHIVE.length}`;
  document.getElementById('stat-links').textContent = `SYNAPSES: ${totalLinks}`;
  document.getElementById('stat-glosses').textContent = `SCHOLIA: ${totalGlosses}`;
}

  const filtered = ZETTEL_ARCHIVE.filter(card => {
    const matchType = state.filterType === 'all' || card.type === state.filterType;
    if (!matchType) return false;
    if (!q) return true;
    const inTitle = card.title.toLowerCase().includes(q);
    const inId = card.id.toLowerCase().includes(q);
    const inTags = card.tags.some(t => t.toLowerCase().includes(q));

      s.prose.toLowerCase().includes(q) || 
      s.marginalia.some(m => m.text.toLowerCase().includes(q))
