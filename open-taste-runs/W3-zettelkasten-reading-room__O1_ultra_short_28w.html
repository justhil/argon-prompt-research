<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zettelkasten & Marginalia Studio — 鲁曼卡片盒与文献批注工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 典藏古籍与档案室定制色板 (Archival Warm Parchment & Iron Gall Ink) */
    --bg-archival: #EFECE6;      /* 亚麻档案底色 */
    --bg-paper: #F9F6F0;         /* 象牙手稿纸 */
    --bg-card: #F3EFE8;          /* 索引卡底色 */
    --bg-card-active: #FCFBF9;   /* 激活卡片底色 */
    --bg-hover: #E7E2D8;         /* 悬停微暗 */
    
    --ink-primary: #1C1B18;      /* 铁胆墨黑 */
    --ink-secondary: #5A554C;    /* 炭灰正文辅助 */
    --ink-muted: #8C857B;        /* 铅笔淡灰 */
    --ink-faint: #B8B1A6;        /* 辅助标尺线文字 */

    --vermilion: #A8382B;        /* 朱砂批注红 */
    --vermilion-bg: rgba(168, 56, 43, 0.08);
    --ochre: #C88A32;            /* 赭石黄（文献） */
    --ochre-bg: rgba(200, 138, 50, 0.14);
    --sage: #3B5E4C;             /* 铜绿（闪念） */
    --sage-bg: rgba(59, 94, 76, 0.10);
    --cobalt: #2B4C65;           /* 普鲁士蓝（双链） */

    --border-hairline: #DCD6CC;  /* 细发丝边框 */
    --border-strong: #B8B0A2;    /* 强调分割线 */
    --border-ink: #2C2A26;       /* 墨线框 */

    --font-serif: 'Cormorant Garamond', 'Noto Serif SC', "Songti SC", serif;
    --font-body: 'Noto Serif SC', 'Source Han Serif SC', "Songti SC", serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --shadow-card: 0 1px 2px rgba(28, 27, 24, 0.04), 0 4px 12px rgba(28, 27, 24, 0.03);
    --shadow-sheet: 0 2px 24px rgba(28, 27, 24, 0.05), 0 0 0 1px rgba(28, 27, 24, 0.06);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-archival);
    color: var(--ink-primary);
    font-family: var(--font-body);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    /* 细微纸张肌理噪点 */
    background-image: radial-gradient(rgba(28, 27, 24, 0.035) 1px, transparent 0);
    background-size: 24px 24px;
  }

  /* ================= 顶部档案室标尺栏 ================= */
  .topbar {
    height: 46px;
    border-bottom: 1px solid var(--border-strong);
    background-color: var(--bg-archival);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
    z-index: 20;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-stamp {
    background: var(--ink-primary);
    color: var(--bg-paper);
    padding: 3px 8px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 10px;
  }

  .brand-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink-primary);
  }

  .brand-sub {
    color: var(--ink-muted);
    border-left: 1px solid var(--border-strong);
    padding-left: 14px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-box input {
    background: var(--bg-paper);
    border: 1px solid var(--border-strong);
    padding: 4px 10px 4px 26px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-primary);
    width: 220px;
    outline: none;
    transition: all 0.2s ease;
  }

  .search-box input:focus {
    border-color: var(--vermilion);
    width: 260px;
    background: #fff;
  }

  .search-icon {
    position: absolute;
    left: 8px;
    color: var(--ink-muted);
    pointer-events: none;
  }

  .stat-pill {
    display: flex;
    gap: 12px;
    color: var(--ink-secondary);
  }

  .stat-pill span b {
    color: var(--ink-primary);
    font-weight: 600;
  }

  /* ================= 主三栏工作台布局 ================= */
  .studio-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 330px 1fr 340px;
    overflow: hidden;
  }

  /* ================= 左栏：卡片盒抽屉 (Slip-Box) ================= */
  .slipbox-panel {
    border-right: 1px solid var(--border-strong);
    background-color: var(--bg-archival);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-secondary);
    font-weight: 600;
  }

  .panel-code {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
  }

  /* 卡片类型筛选器 */
  .filter-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border-strong);
    background: var(--bg-card);
  }

  .filter-tab {
    appearance: none;
    background: transparent;
    border: none;
    border-right: 1px solid var(--border-hairline);
    padding: 9px 4px;
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: relative;
  }

  .filter-tab:last-child {
    border-right: none;
  }

  .filter-tab .tab-en {
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
  }

  .filter-tab:hover {
    background: var(--bg-hover);
    color: var(--ink-primary);
  }

  .filter-tab.active {
    background: var(--bg-paper);
    color: var(--ink-primary);
    font-weight: 600;
  }

  .filter-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--vermilion);
  }

  /* 学科主题标签栏 */
  .tag-bar {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: rgba(249, 246, 240, 0.45);
  }

  .topic-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 7px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .topic-tag:hover {
    border-color: var(--ink-primary);
    color: var(--ink-primary);
  }

  .topic-tag.active {
    background: var(--ink-primary);
    color: var(--bg-paper);
    border-color: var(--ink-primary);
  }

  /* 索引卡列表流 */
  .card-stream {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-stream::-webkit-scrollbar {
    width: 5px;
  }
  .card-stream::-webkit-scrollbar-thumb {
    background: var(--border-strong);
  }

  .zettel-card {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 12px 14px;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    box-shadow: var(--shadow-card);
  }

  /* 拟真打孔卡片顶部微压线 */
  .zettel-card::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(168, 56, 43, 0.18);
    pointer-events: none;
  }

  .zettel-card:hover {
    background: var(--bg-card-active);
    border-color: var(--ink-secondary);
    transform: translateY(-1px);
  }

  .zettel-card.active {
    background: var(--bg-card-active);
    border-color: var(--ink-primary);
    border-left: 4px solid var(--vermilion);
    box-shadow: 0 4px 16px rgba(28, 27, 24, 0.08);
  }

  .card-meta-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding-top: 2px;
  }

  .folgezettel-id {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--vermilion);
    letter-spacing: 0.02em;
  }

  .card-type-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 1px 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px solid currentColor;
  }

  .badge-permanent {
    color: var(--vermilion);
    background: var(--vermilion-bg);
  }

  .badge-literature {
    color: #9A6316;
    background: var(--ochre-bg);
  }

  .badge-fleeting {
    color: var(--sage);
    background: var(--sage-bg);
  }

  .card-title {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--ink-primary);
    margin-bottom: 6px;
  }

  .card-excerpt {
    font-size: 12px;
    color: var(--ink-secondary);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px dashed var(--border-hairline);
    padding-top: 7px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
  }

  .card-tags-mini {
    display: flex;
    gap: 6px;
  }

  /* ================= 中栏：主阅读手稿与页边批注 (Manuscript & Marginalia) ================= */
  .manuscript-stage {
    background-color: #E6E1D8;
    overflow-y: auto;
    padding: 28px 32px 60px;
    position: relative;
    /* 桌面垫纹理 */
    background-image: 
      linear-gradient(to right, rgba(28, 27, 24, 0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(28, 27, 24, 0.03) 1px, transparent 1px);
    background-size: 36px 36px;
  }

  .manuscript-stage::-webkit-scrollbar {
    width: 7px;
  }
  .manuscript-stage::-webkit-scrollbar-thumb {
    background: var(--border-strong);
  }

  /* 手稿纸张容器：内含左正文 + 右批注栏 */
  .paper-sheet {
    max-width: 960px;
    margin: 0 auto;
    background-color: var(--bg-paper);
    box-shadow: var(--shadow-sheet);
    border: 1px solid var(--border-strong);
    position: relative;
    min-height: calc(100vh - 110px);
    display: flex;
    flex-direction: column;
  }

  /* 档案打孔装饰与顶部红线 */
  .sheet-archival-header {
    padding: 22px 44px 18px;
    border-bottom: 2px double var(--border-strong);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: linear-gradient(to bottom, rgba(239, 236, 230, 0.5), transparent);
  }

  .sheet-call-number {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .call-label {
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
  }

  .call-id {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--vermilion);
    letter-spacing: -0.02em;
  }

  .sheet-meta-table {
    display: grid;
    grid-template-columns: auto auto;
    gap: 4px 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    border-left: 1px solid var(--border-strong);
    padding-left: 16px;
  }

  .meta-key {
    color: var(--ink-muted);
    text-transform: uppercase;
  }

  .meta-val {
    color: var(--ink-primary);
    font-weight: 500;
  }

  /* 经典古籍不对称双栏：正文区 + Marginalia 页边批注栏 */
  .sheet-body-grid {
    display: grid;
    grid-template-columns: 1fr 270px;
    flex: 1;
    position: relative;
  }

  /* 正文排版区 */
  .prose-column {
    padding: 36px 42px 54px 44px;
    border-right: 1px solid rgba(168, 56, 43, 0.25); /* 古籍朱丝栏竖线 */
  }

  .manuscript-title {
    font-family: var(--font-serif);
    font-size: 29px;
    font-weight: 700;
    line-height: 1.32;
    color: var(--ink-primary);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .manuscript-subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 15.5px;
    color: var(--ink-secondary);
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-hairline);
  }

  .source-citation-box {
    background: var(--bg-archival);
    border-left: 3px solid var(--ochre);
    padding: 10px 14px;
    margin-bottom: 26px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-secondary);
    line-height: 1.5;
  }

  .prose-content p {
    font-size: 16.5px;
    line-height: 1.95;
    color: var(--ink-primary);
    margin-bottom: 22px;
    text-align: justify;
    position: relative;
  }

  /* 首字下沉 */
  .prose-content p:first-of-type::first-letter {
    font-family: var(--font-serif);
    float: left;
    font-size: 3.1em;
    line-height: 0.85;
    padding-right: 10px;
    padding-top: 4px;
    color: var(--vermilion);
    font-weight: 700;
  }

  .prose-content blockquote {
    margin: 24px 0;
    padding: 12px 20px;
    border-left: 2px solid var(--ink-primary);
    background: rgba(239, 236, 230, 0.45);
    font-style: italic;
    color: var(--ink-secondary);
    font-size: 15.5px;
    line-height: 1.8;
  }

  /* 行间高亮批注锚点 (Marginalia Highlight) */
  .hl-passage {
    background: linear-gradient(transparent 58%, rgba(200, 138, 50, 0.25) 58%);
    border-bottom: 1px dashed var(--vermilion);
    cursor: pointer;
    padding: 0 2px;
    transition: all 0.2s ease;
    position: relative;
  }

  .hl-passage:hover,
  .hl-passage.active {
    background: rgba(168, 56, 43, 0.15);
    border-bottom: 1.5px solid var(--vermilion);
  }

  .hl-sup {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--vermilion);
    vertical-align: super;
    margin-left: 2px;
    user-select: none;
  }

  /* 文内双链引用标签 [[ID]] */
  .wikilink {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--cobalt);
    background: rgba(43, 76, 101, 0.08);
    border: 1px solid rgba(43, 76, 101, 0.28);
    padding: 0 6px;
    margin: 0 2px;
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
    vertical-align: baseline;
  }

  .wikilink:hover {
    background: var(--cobalt);
    color: var(--bg-paper);
    border-color: var(--cobalt);
  }

  /* 侧边批注栏 (Marginalia Column) */
  .marginalia-column {
    padding: 28px 18px 40px 18px;
    background: rgba(239, 236, 230, 0.28);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .marginalia-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-hairline);
  }

  .marginalia-header span {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--vermilion);
    font-weight: 600;
  }

  .btn-add-margin {
    background: transparent;
    border: 1px solid var(--border-strong);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-add-margin:hover {
    border-color: var(--vermilion);
    color: var(--vermilion);
    background: var(--bg-paper);
  }

  .marginalia-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .margin-note-card {
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    border-left: 2.5px solid var(--border-strong);
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .margin-note-card:hover,
  .margin-note-card.active {
    border-color: var(--vermilion);
    border-left-width: 3.5px;
    background: #FFFDF9;
    color: var(--ink-primary);
    transform: translateX(-3px);
    box-shadow: 0 3px 12px rgba(168, 56, 43, 0.08);
  }

  .margin-note-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    font-family: var(--font-mono);
    font-size: 10px;
  }

  .margin-marker {
    color: var(--vermilion);
    font-weight: 600;
  }

  .margin-author {
    color: var(--ink-muted);
  }

  .margin-quote-ref {
    font-size: 11px;
    font-style: italic;
    color: var(--ink-muted);
    margin-bottom: 6px;
    padding-left: 6px;
    border-left: 1px solid var(--border-strong);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 新增批注迷你表单 */
  .add-margin-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: #FFFDF9;
    border: 1px solid var(--vermilion);
    padding: 10px;
  }

  .add-margin-form.open {
    display: flex;
  }

  .add-margin-form textarea {
    width: 100%;
    min-height: 64px;
    border: 1px solid var(--border-hairline);
    background: var(--bg-paper);
    padding: 6px;
    font-family: var(--font-body);
    font-size: 12px;
    resize: vertical;
    outline: none;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .btn-mini {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    cursor: pointer;
  }

  .btn-mini.primary {
    background: var(--vermilion);
    color: #fff;
    border-color: var(--vermilion);
  }

  /* 手稿底部接续分支卡片导航 (Folgezettel Branching) */
  .sheet-footer-branches {
    border-top: 1px solid var(--border-strong);
    padding: 16px 44px;
    background: var(--bg-archival);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .branch-links {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .branch-pill {
    padding: 3px 9px;
    border: 1px solid var(--border-strong);
    background: var(--bg-paper);
    color: var(--ink-primary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .branch-pill:hover {
    border-color: var(--vermilion);
    color: var(--vermilion);
  }

  /* ================= 右栏：知识拓扑小图谱与反向链接 (Graph & Backlinks) ================= */
  .context-panel {
    border-left: 1px solid var(--border-strong);
    background-color: var(--bg-archival);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .graph-container {
    height: 300px;
