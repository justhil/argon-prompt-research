<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zettelkasten & Marginalia Studio — 卢曼卡片盒与文献批注工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* 瑞士档案网格 + 北欧暖调纸面 + 博朗实体仪器色板 */
    --bg-canvas: #F3F1EC;
    --bg-paper: #FAF8F5;
    --bg-panel: #EBE8E0;
    --bg-hover: #E4E0D6;
    --bg-active: #EFECE4;
    
    --ink-primary: #181715;
    --ink-secondary: #52504C;
    --ink-muted: #85827C;
    --ink-faint: #B5B1A8;

    --border-hairline: #D5D1C8;
    --border-strong: #181715;

    /* 实体仪器功能色彩 */
    --accent-vermilion: #D13B27; /* 永久笔记 / 核心锚点 */
    --accent-cobalt: #205285;    /* 文献笔记 / 双链引用 */
    --accent-ochre: #C87D20;     /* 闪念笔记 / 批注标记 */
    --accent-forest: #2E6F40;    /* 状态指示 */

    --hl-bg: rgba(200, 125, 32, 0.14);
    --hl-bg-active: rgba(209, 59, 39, 0.18);
    --hl-border: #C87D20;
    --hl-border-active: #D13B27;

    --font-serif: 'Newsreader', 'Noto Serif SC', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--ink-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* 顶部瑞士网格仪器栏 */
  .topbar {
    height: 42px;
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-strong);
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    align-items: center;
    user-select: none;
    flex-shrink: 0;
  }

  .brand-cell {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-right: 1px solid var(--border-hairline);
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    gap: 10px;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    background-color: var(--accent-vermilion);
    display: inline-block;
  }

  .breadcrumb-cell {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-right: 1px solid var(--border-hairline);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }

  .crumb-trail {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .crumb-sep {
    color: var(--ink-faint);
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn-instrument {
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    color: var(--ink-primary);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: all 0.12s ease;
  }

  .btn-instrument:hover {
    border-color: var(--ink-primary);
    background: var(--bg-canvas);
  }

  .btn-instrument.active {
    background: var(--ink-primary);
    color: var(--bg-paper);
    border-color: var(--ink-primary);
  }

  .telemetry-cell {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* 主体三栏工作区 */
  .studio-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    height: calc(100vh - 42px);
    overflow: hidden;
  }

  /* ==================== 左侧：卡片盒索引流 ==================== */
  .pane-left {
    background-color: var(--bg-canvas);
    border-right: 1px solid var(--border-hairline);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .pane-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-hairline);
    background-color: var(--bg-panel);
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .search-box {
    width: 100%;
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-primary);
    outline: none;
    margin-bottom: 10px;
  }

  .search-box:focus {
    border-color: var(--ink-primary);
  }

  /* 实体分段开关 */
  .filter-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--border-hairline);
    background: var(--bg-paper);
  }

  .filter-tab {
    background: transparent;
    border: none;
    border-right: 1px solid var(--border-hairline);
    padding: 5px 0;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-secondary);
    cursor: pointer;
    text-align: center;
    transition: background 0.1s;
    font-variant-numeric: tabular-nums;
  }

  .filter-tab:last-child {
    border-right: none;
  }

  .filter-tab:hover {
    background: var(--bg-hover);
  }

  .filter-tab.active {
    background: var(--ink-primary);
    color: var(--bg-paper);
    font-weight: 500;
  }

  .tag-strip {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--bg-canvas);
  }

  .tag-chip {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid var(--border-hairline);
    background: var(--bg-paper);
    color: var(--ink-secondary);
    cursor: pointer;
  }

  .tag-chip:hover {
    border-color: var(--ink-secondary);
  }

  .tag-chip.active {
    border-color: var(--accent-vermilion);
    color: var(--accent-vermilion);
    background: rgba(209, 59, 39, 0.06);
  }

  .card-stream {
    flex: 1;
    overflow-y: auto;
  }

  .zettel-card {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-hairline);
    cursor: pointer;
    background: var(--bg-canvas);
    transition: background 0.12s ease;
    position: relative;
  }

  .zettel-card:hover {
    background: var(--bg-hover);
  }

  .zettel-card.active {
    background: var(--bg-paper);
  }

  .zettel-card.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent-vermilion);
  }

  .card-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .folgezettel-id {
    font-weight: 600;
    color: var(--ink-primary);
    letter-spacing: 0.02em;
  }

  .type-badge {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 5px;
    border: 1px solid;
  }

  .type-permanent {
    color: var(--accent-vermilion);
    border-color: rgba(209, 59, 39, 0.4);
    background: rgba(209, 59, 39, 0.05);
  }

  .type-literature {
    color: var(--accent-cobalt);
    border-color: rgba(32, 82, 133, 0.4);
    background: rgba(32, 82, 133, 0.05);
  }

  .type-fleeting {
    color: var(--accent-ochre);
    border-color: rgba(200, 125, 32, 0.4);
    background: rgba(200, 125, 32, 0.05);
  }

  .card-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-primary);
    margin-bottom: 5px;
    line-height: 1.35;
  }

  .card-excerpt {
    font-size: 12px;
    color: var(--ink-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
    line-height: 1.45;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ==================== 中部：主阅读与边注工作室 ==================== */
  .pane-center {
    background-color: var(--bg-paper);
    overflow-y: auto;
    height: 100%;
    position: relative;
  }

  /* 纸面顶部档案头 */
  .manuscript-header {
    padding: 36px 48px 28px 48px;
    border-bottom: 1px solid var(--border-hairline);
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 36px;
    max-width: 1120px;
    margin: 0 auto;
  }

  .doc-id-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }

  .doc-id-code {
    background: var(--ink-primary);
    color: var(--bg-paper);
    padding: 2px 8px;
    font-weight: 600;
  }

  .doc-title {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--ink-primary);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .doc-subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 16px;
    color: var(--ink-secondary);
    line-height: 1.4;
  }

  /* 档案规格表 (Swiss Spec Table) */
  .archive-spec-table {
    border: 1px solid var(--border-hairline);
    background: var(--bg-canvas);
    font-family: var(--font-mono);
    font-size: 10px;
    align-self: start;
    font-variant-numeric: tabular-nums;
  }

  .spec-row {
    display: grid;
    grid-template-columns: 76px 1fr;
    border-bottom: 1px solid var(--border-hairline);
  }

  .spec-row:last-child {
    border-bottom: none;
  }

  .spec-key {
    padding: 5px 8px;
    color: var(--ink-muted);
    border-right: 1px solid var(--border-hairline);
    text-transform: uppercase;
  }

  .spec-val {
    padding: 5px 8px;
    color: var(--ink-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 稿件双栏网格：左正文 + 右边注栏 (Marginalia) */
  .manuscript-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 36px;
    padding: 32px 48px 96px 48px;
    max-width: 1120px;
    margin: 0 auto;
    position: relative;
  }

  .prose-column {
    font-family: var(--font-serif);
    font-size: 17px;
    line-height: 1.82;
    color: var(--ink-primary);
  }

  .prose-block {
    position: relative;
    margin-bottom: 24px;
    padding-left: 4px;
  }

  .para-num {
    position: absolute;
    left: -34px;
    top: 5px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    user-select: none;
    font-variant-numeric: tabular-nums;
  }

  .prose-block blockquote {
    border-left: 2px solid var(--ink-primary);
    padding-left: 18px;
    margin: 20px 0;
    font-style: italic;
    color: var(--ink-secondary);
  }

  /* 行间批注高亮 */
  .hl-span {
    background-color: var(--hl-bg);
    border-bottom: 1.5px solid var(--hl-border);
    padding: 1px 2px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
    position: relative;
  }

  .hl-span sup {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--accent-vermilion);
    margin-left: 2px;
    user-select: none;
  }

  .hl-span:hover,
  .hl-span.active {
    background-color: var(--hl-bg-active);
    border-bottom-color: var(--hl-border-active);
  }

  /* 内联双链 Wiki-link */
  .wikilink {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-cobalt);
    background: rgba(32, 82, 133, 0.06);
    border: 1px solid rgba(32, 82, 133, 0.25);
    padding: 1px 6px;
    margin: 0 2px;
    cursor: pointer;
    text-decoration: none;
    display: inline-baseline;
    transition: all 0.12s ease;
    font-variant-numeric: tabular-nums;
  }

  .wikilink:hover {
    background: var(--accent-cobalt);
    color: var(--bg-paper);
    border-color: var(--accent-cobalt);
  }

  /* 侧边批注栏 (Marginalia Column) */
  .marginalia-column {
    border-left: 1px solid var(--border-hairline);
    padding-left: 20px;
    position: relative;
  }

  .marginalia-header {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    margin-bottom: 16px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    justify-content: space-between;
  }

  .margin-note {
    background: var(--bg-canvas);
    border: 1px solid var(--border-hairline);
    padding: 10px 12px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }

  .margin-note::before {
    content: "";
    position: absolute;
    left: -21px;
    top: 14px;
    width: 20px;
    height: 1px;
    background: var(--border-hairline);
    transition: background 0.15s ease;
  }

  .margin-note:hover,
  .margin-note.active {
    border-color: var(--accent-vermilion);
    background: var(--bg-paper);
    transform: translateX(-3px);
  }

  .margin-note:hover::before,
  .margin-note.active::before {
    background: var(--accent-vermilion);
    height: 1.5px;
  }

  .mn-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }

  .mn-badge {
    color: var(--accent-vermilion);
    font-weight: 600;
  }

  .mn-quote {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 11px;
    color: var(--ink-muted);
    border-left: 2px solid var(--border-hairline);
    padding-left: 6px;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .mn-text {
    font-family: var(--font-sans);
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-primary);
  }

  /* 新增批注表单 */
  .add-marginalia-box {
    margin-top: 20px;
    border: 1px dashed var(--border-hairline);
    padding: 10px;
    background: rgba(235, 232, 224, 0.4);
  }

  .add-marginalia-title {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .mn-input {
    width: 100%;
    border: 1px solid var(--border-hairline);
    background: var(--bg-paper);
    padding: 6px 8px;
    font-family: var(--font-sans);
    font-size: 12px;
    resize: vertical;
    min-height: 54px;
    outline: none;
    margin-bottom: 6px;
  }

  .mn-input:focus {
    border-color: var(--ink-primary);
  }

  /* ==================== 右侧：双链关系小图谱与反向引用 ==================== */
  .pane-right {
    background-color: var(--bg-canvas);
    border-left: 1px solid var(--border-hairline);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  .graph-container {
    height: 280px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    flex-direction: column;
    background: var(--bg-paper);
    flex-shrink: 0;
  }

  .graph-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-hairline);
    background: var(--bg-panel);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
  }

  .graph-legend {
    display: flex;
    gap: 10px;
    font-size: 9px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .svg-viewport {
    flex: 1;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(var(--border-hairline) 1px, transparent 1px);
    background-size: 16px 16px;
    position: relative;
    overflow: hidden;
  }

  #network-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .graph-node {
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .graph-node text {
    font-family: var(--font-mono);
    font-size: 9px;
    fill: var(--ink-primary);
    pointer-events: none;
  }

  .graph-link {
    stroke: var(--ink-faint);
    stroke-width: 1px;
  }

  .graph-link.active-edge {
    stroke: var(--ink-primary);
    stroke-width: 1.5px;
  }

  /* 反向链接与出链列表区 */
  .connections-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  .conn-section {
    margin-bottom: 24px;
  }

  .conn-header {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-hairline);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }

  .backlink-card {
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }

  .backlink-card:hover {
    border-color: var(--ink-primary);
    background: var(--bg-active);
  }

  .bl-top {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }

  .bl-id {
    font-weight: 600;
    color: var(--accent-cobalt);
  }

  .bl-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-primary);
    margin-bottom: 4px;
  }

  .bl-context {
    font-size: 11px;
    color: var(--ink-secondary);
    line-height: 1.45;
    background: var(--bg-canvas);
    padding: 6px 8px;
    border-left: 2px solid var(--accent-cobalt);
    font-family: var(--font-serif);
  }

  /* 选中文字浮动工具条 */
  #selection-popover {
    position: fixed;
    display: none;
    background: var(--ink-primary);
    color: var(--bg-paper);
    border: 1px solid var(--ink-primary);
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    z-index: 1000;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #selection-popover:hover {
    background: var(--accent-vermilion);
    border-color: var(--accent-vermilion);
  }

  /* 滚动条微调 */
  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }

// 应用状态管理
const state = {
  activeNoteId: "ZK-12/4a",
  filterType: "all",
  activeTag: null,
  searchQuery: "",
  activeHighlightId: null,
  showHighlights: true
};

// 工具函数：解析所有卡片的双向链接关系
function buildLinkGraph() {
  const outgoingMap = {};
  const incomingMap = {};
  const edgeList = [];

  ZETTEL_DATA.forEach(note => {
    outgoingMap[note.id] = [];
    incomingMap[note.id] = [];
  });

  const linkRegex = /data-target="([^"]+)"/g;

  ZETTEL_DATA.forEach(sourceNote => {
    sourceNote.paragraphs.forEach((para, pIdx) => {
      let match;
      while ((match = linkRegex.exec(para)) !== null) {
        const targetId = match[1];
        if (outgoingMap[sourceNote.id] && !outgoingMap[sourceNote.id].some(item => item.id === targetId)) {
          outgoingMap[sourceNote.id].push({
            id: targetId,
            contextPara: stripHtml(para)
          });
        }
        if (incomingMap[targetId] && !incomingMap[targetId].some(item => item.id === sourceNote.id)) {
          incomingMap[targetId].push({
            id: sourceNote.id,
            contextPara: stripHtml(para),
            paraIndex: pIdx + 1
          });
        }
        // 记录无向边用于图谱绘制
        const edgeKey = [sourceNote.id, targetId].sort().join("--");
        if (!edgeList.some(e => e.key === edgeKey)) {
          edgeList.push({ key: edgeKey, source: sourceNote.id, target: targetId });
        }
      }
    });
  });

  return { outgoingMap, incomingMap, edgeList };
}

function stripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || "";
}

function getTypeBadgeClass(type) {
  if (type === "permanent") return "type-permanent";
  if (type === "literature") return "type-literature";
  return "type-fleeting";
}

function getTypeColor(type) {
  if (type === "permanent") return "#D13B27";
  if (type === "literature") return "#205285";
  return "#C87D20";
}

// 1. 渲染左侧标签栏
function renderTagStrip() {
  const tagSet = new Set();
  ZETTEL_DATA.forEach(n => n.tags.forEach(t => tagSet.add(t)));
  const strip = document.getElementById("tag-strip");
  strip.innerHTML = "";

  const allChip = document.createElement("span");
  allChip.className = `tag-chip ${state.activeTag === null ? "active" : ""}`;
  allChip.textContent = "ALL_TAGS";
  allChip.onclick = () => {
    state.activeTag = null;
    renderTagStrip();
    renderCardStream();
  };
  strip.appendChild(allChip);

  Array.from(tagSet).forEach(tag => {
    const chip = document.createElement("span");
    chip.className = `tag-chip ${state.activeTag === tag ? "active" : ""}`;
    chip.textContent = tag;
    chip.onclick = () => {
      state.activeTag = state.activeTag === tag ? null : tag;
      renderTagStrip();
      renderCardStream();
    };
    strip.appendChild(chip);
  });
}

// 2. 渲染左侧卡片索引流
function renderCardStream() {
  const container = document.getElementById("card-stream");
  const { incomingMap, outgoingMap } = buildLinkGraph();

  const filtered = ZETTEL_DATA.filter(note => {
    const matchType = state.filterType === "all" || note.type === state.filterType;
    const matchTag = !state.activeTag || note.tags.includes(state.activeTag);
    const q = state.searchQuery.trim().toLowerCase();
    const matchSearch = !q || 
      note.id.toLowerCase().includes(q) ||
      note.title.toLowerCase().includes(q) ||
      note.excerpt.toLowerCase().includes(q) ||
      note.paragraphs.join(" ").toLowerCase().includes(q);
    return matchType && matchTag && matchSearch;
  });

  document.getElementById("index-count").textContent = `${filtered.length} ENTRIES`;
  container.innerHTML = "";

  if (filtered.length === 0) {
    container.innerHTML = `<div style="padding: 24px 16px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);">[NO MATCHING CARDS IN SLIP-BOX]</div>`;
    return;
  }

  filtered.forEach(note => {
    const card = document.createElement("div");
    card.className = `zettel-card ${note.id === state.activeNoteId ? "active" : ""}`;
    const inCount = incomingMap[note.id]?.length || 0;
    const outCount = outgoingMap[note.id]?.length || 0;

    card.innerHTML = `
      <div class="card-meta-row">
        <span class="folgezettel-id">${note.id}</span>
        <span class="type-badge ${getTypeBadgeClass(note.type)}">${note.typeName}</span>
      </div>
      <div class="card-title">${note.title}</div>
      <div class="card-excerpt">${note.excerpt}</div>
      <div class="card-footer">
        <span>${note.tags.slice(0, 2).join(" ")}</span>
        <span>⇄ ${inCount + outCount} · ✎ ${note.marginalia.length}</span>
      </div>
    `;

    card.onclick = () => selectNote(note.id);
    container.appendChild(card);
  });
}

// 3. 渲染中部主阅读区与侧边批注栏
function renderManuscript() {
  const note = ZETTEL_DATA.find(n => n.id === state.activeNoteId);
  if (!note) return;

  // 更新顶部面包屑
  document.getElementById("crumb-type").textContent = note.type.toUpperCase();
  document.getElementById("crumb-id").textContent = note.id;

  // 渲染文稿头部与瑞士规格表
  const headerEl = document.getElementById("manuscript-header");
  headerEl.innerHTML = `
    <div>
      <div class="doc-id-bar">
        <span class="doc-id-code">${note.id}</span>
        <span class="type-badge ${getTypeBadgeClass(note.type)}">${note.typeName} / ${note.type.toUpperCase()}</span>
        <span style="color: var(--ink-muted);">${note.tags.join("  ")}</span>
      </div>
      <h1 class="doc-title">${note.title}</h1>
      <div class="doc-subtitle">${note.subtitle}</div>
    </div>
    <div class="archive-spec-table">
      <div class="spec-row">
        <div class="spec-key">FOLGE-ID</div>
        <div class="spec-val">${note.id}</div>
      </div>
      <div class="spec-row">
        <div class="spec-key">ARCHIVED</div>
        <div class="spec-val">${note.date}</div>
      </div>
      <div class="spec-row">
        <div class="spec-key">SOURCE</div>
        <div class="spec-val" title="${note.source}">${note.source}</div>
      </div>
      <div class="spec-row">
        <div class="spec-key">MARGINALIA</div>
        <div class="spec-val">${String(note.marginalia.length).padStart(2, '0')} ANNOTATIONS</div>
      </div>
    </div>
  `;

  // 渲染正文段落
  const proseEl = document.getElementById("prose-column");
  proseEl.innerHTML = "";

  note.paragraphs.forEach((paraHtml, idx) => {
    const block = document.createElement("div");
    block.className = "prose-block";
    const pNum = String(idx + 1).padStart(2, "0");
    block.innerHTML = `<span class="para-num">§${pNum}</span>${paraHtml}`;
    proseEl.appendChild(block);
  });

  // 处理高亮显示状态
  if (!state.showHighlights) {
    proseEl.querySelectorAll(".hl-span").forEach(el => {
      el.style.backgroundColor = "transparent";
      el.style.borderBottomColor = "transparent";
    });
  }

  // 绑定正文中内联双链点击事件
  proseEl.querySelectorAll(".wikilink").forEach(link => {
    link.addEventListener("click", (e) => {
      e.stopPropagation();
      const targetId = link.getAttribute("data-target");
      if (targetId) selectNote(targetId);
    });
  });

  // 绑定正文中行间高亮点击/悬停事件
  proseEl.querySelectorAll(".hl-span").forEach(span => {
    const hlId = span.getAttribute("data-hl");
    span.addEventListener("click", (e) => {
      e.stopPropagation();
      activateHighlight(hlId);
    });
    span.addEventListener("mouseenter", () => highlightPairHover(hlId, true));
    span.addEventListener("mouseleave", () => highlightPairHover(hlId, false));
  });

  // 渲染侧边批注栏 Marginalia
  renderMarginalia(note);
}

  document.getElementById("marginalia-count").textContent = String(note.marginalia.length).padStart(2, "0");

    const item = document.createElement("div");

      <div class="mn-meta">
        <span class="mn-badge">[${mn.id}] ${mn.author}</span>
        <span>${mn.timestamp}</span>
      </div>
      <div class="mn-quote">“${mn.refText}”</div>
      <div class="mn-text">${mn.comment}</div>
    `;

    item.addEventListener("click", () => activateHighlight(mn.id));
    item.addEventListener("mouseenter", () => highlightPairHover(mn.id, true));
